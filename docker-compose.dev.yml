# Local development: builds the image from this folder instead of pulling it, under its
# own name, so it never replaces the image pulled from Docker Hub.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  app:
    build: .
    image: mortgage-management-app:dev
    pull_policy: build
    environment:
      CHECK_FOR_UPDATES: "false"  # a development build never offers an update
