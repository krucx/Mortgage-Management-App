# Development: hot reload for both halves.
#   docker compose -f compose.yml -f compose.dev.yml up
services:
  backend:
    command: ["python", "-m", "mortgage_backend", "--reload"]
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 80"
    environment:
      API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
