server {
    listen 80;
    root /usr/share/nginx/html;

    # Phone photos are often several MB (nginx defaults to 1 MB).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths load index.html, checked for a new version each time.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # The service worker and the files it starts from: always checked, so an update
    # reaches the installed app on its next start.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # nginx doesn't know the .webmanifest type.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Built files carry a hash in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
