[project]
name = "mortgage-backend"
version = "3.4.4"
description = "Backend API for the jewellery Mortgage management app"
authors = [
    { name = "krucx", email = "kritarth.jain11@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "fpdf2>=2.9.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
