[project]
name = "mortgage-backend"
version = "3.4.10"
description = "Backend API for the jewellery Mortgage management app"
authors = [
    { name = "krucx", email = "kritarth.jain11@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.3",
    "fpdf2>=2.9.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
# Pyflakes and pycodestyle errors, import order, likely bugs (flake8-bugbear) and
# modern syntax (pyupgrade). Line length (E501) is left to the formatter, whose default
# of 88 columns fits the current code with the least churn (100 reformats more files).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query parameters as `Query(...)` defaults.
"src/mortgage_backend/lending/dashboard.py" = ["B008"]
