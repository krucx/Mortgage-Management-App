version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all action bumps found in a run, instead of one PR per action.
    # Security fixes get their own single PR, kept apart from routine bumps.
    groups:
      github-actions:
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # TypeScript 7 is the native port with no `ts` JS API, which openapi-typescript needs.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # Same grouping as above, for the frontend's npm packages.
    groups:
      npm:
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
