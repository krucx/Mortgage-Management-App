name: Secret scanning alert issues

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scanning-alert-issues
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reconcile Secret scanning alerts
        env:
          SECRET_SCANNING_TOKEN: ${{ secrets.SECRET_SCANNING_TOKEN }}
        run: node .github/scripts/secret-scanning-alerts.mjs
