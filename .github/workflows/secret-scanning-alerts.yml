name: Secret scanning alert issues

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scanning-alert-issues
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconcile Secret scanning alerts
        env:
          SECRET_SCANNING_TOKEN: ${{ secrets.SECRET_SCANNING_TOKEN }}
        run: node .github/scripts/secret-scanning-alerts.mjs
