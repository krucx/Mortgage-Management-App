name: Publish merged release candidate

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged release candidate PR number to safely retry
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read
  checks: read
  actions: write

concurrency:
  group: publish-release-pr-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  publish:
    name: release-publish
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_WORKFLOW_TOKEN || github.token }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate the merged release PR and its review
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          node .github/scripts/release.mjs validate-candidate \
            --repo "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" --version "$version" \
            > /tmp/release-candidate.json
          commit=$(jq -r .commit /tmp/release-candidate.json)
          head_commit=$(jq -r .headCommit /tmp/release-candidate.json)
          pr=$(jq -r .pullRequest /tmp/release-candidate.json)
          node .github/scripts/release.mjs release-notes \
            --version "$version" --changelog CHANGELOG.md > /tmp/release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "head_commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "- Approved release PR #$pr targets main and all reported checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- VERSION $version and its dated changelog section are valid." >> "$GITHUB_STEP_SUMMARY"

      - name: Create or safely reuse the version tag
        id: tag
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          MERGE_COMMIT: ${{ steps.candidate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_TOKEN_AVAILABLE: ${{ secrets.RELEASE_WORKFLOW_TOKEN != '' }}
        run: |
          set -euo pipefail
          node .github/scripts/release.mjs tag \
            --repo "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$MERGE_COMMIT" \
            --allow-create "$RELEASE_WORKFLOW_TOKEN_AVAILABLE" > /tmp/release-tag.json
          action=$(jq -r .action /tmp/release-tag.json)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "- Tag $VERSION is present at the approved release merge commit ($action)." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the image and GitHub release publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.candidate.outputs.version }}
          MERGE_COMMIT: ${{ steps.candidate.outputs.commit }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr }}
        run: |
          # No -e: a failed dispatch-and-wait still prints JSON (see release.mjs), and this
          # step needs its own exit code captured after reading that JSON, not before.
          set -uo pipefail
          node .github/scripts/release.mjs dispatch-and-wait \
            --repo "$GITHUB_REPOSITORY" --workflow release.yml --ref "$VERSION" \
            --input "pull_request=$PR_NUMBER" --match-sha "$MERGE_COMMIT" \
            --timeout-minutes 60 > /tmp/release-publisher-run.json
          status=$?
          url=$(jq -r .url /tmp/release-publisher-run.json)
          conclusion=$(jq -r .conclusion /tmp/release-publisher-run.json)
          [[ "$url" == null ]] || echo "url=$url" >> "$GITHUB_OUTPUT"
          [[ "$conclusion" == null ]] || echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Publisher run: ${url:-not found} (${conclusion:-timed out})" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Report incomplete publication and safe recovery
        if: failure()
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          TAG_ACTION: ${{ steps.tag.outputs.action }}
          PUBLISHER_URL: ${{ steps.publisher.outputs.url }}
        run: |
          {
            echo '## Release publication stopped'
            echo "- Candidate validation completed for: ${VERSION:-not validated}"
            echo "- Tag action: ${TAG_ACTION:-not started}"
            echo "- Release publisher: ${PUBLISHER_URL:-not completed}"
            echo '- Inspect the failed step and publisher logs before retrying.'
            echo '- Reruns reuse the version tag only when it points to the same merged commit; the release publisher safely replaces the same versioned image, notes and ZIP.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report verified publication
        if: success()
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr }}
          PUBLISHER_URL: ${{ steps.publisher.outputs.url }}
        run: |
          {
            echo '## Release published and verified'
            echo "- Release PR: #$PR_NUMBER"
            echo "- Version: $VERSION"
            echo '- GitHub release notes and ZIP, versioned Docker image, and latest tag when applicable: verified.'
            echo "- Publisher run: $PUBLISHER_URL"
          } >> "$GITHUB_STEP_SUMMARY"
