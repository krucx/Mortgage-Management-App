name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs these before publishing images.
  workflow_call:
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test .github/scripts/test-release-candidate.mjs

  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test .github/scripts/test-publish-release.mjs

  critical-finding-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test .github/scripts/test-critical-findings.mjs

  secret-scanning-alert-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test .github/scripts/test-secret-scanning-alerts.mjs

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Current versions agree with VERSION
        run: node ../.github/scripts/check-version.mjs
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run mypy src
      - name: Run backend tests and collect line coverage
        run: uv run pytest --cov=mortgage_backend --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-report=term
      - name: Compare backend coverage with the pull request base
        id: backend-base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/backend-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/backend-base/backend"
          uv sync --frozen
          uv run pytest --cov=mortgage_backend --cov-report=xml:"$RUNNER_TEMP/backend-base/coverage.xml" --cov-report=term
      - name: Add backend coverage to the job summary
        env:
          BASE_REPORT: ${{ steps.backend-base.outcome == 'success' && format('{0}/backend-base/coverage.xml', runner.temp) || '' }}
          BASE_OUTCOME: ${{ steps.backend-base.outcome }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage.xml")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("Backend coverage report is missing or empty")
          rate = float(ET.parse(report).getroot().attrib["line-rate"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Backend line coverage\n\nPR: {rate:.1%}")
              baseline = os.environ.get("BASE_REPORT")
              if baseline:
                  if not Path(baseline).is_file():
                      raise SystemExit("Backend base coverage report is missing")
                  base_rate = float(ET.parse(baseline).getroot().attrib["line-rate"])
                  summary.write(f" · base: {base_rate:.1%} · change: {(rate - base_rate) * 100:+.1f} percentage points")
              elif os.environ.get("BASE_OUTCOME") == "failure":
                  summary.write(" · base comparison unavailable (base tests did not pass)")
              summary.write("\n")
          PY
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Run frontend tests and collect line coverage
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=html --coverage.reporter=text
      - name: Compare frontend coverage with the pull request base
        id: frontend-base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/frontend-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/frontend-base/frontend"
          npm ci
          npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text
      - name: Add frontend coverage to the job summary
        env:
          BASE_REPORT: ${{ steps.frontend-base.outcome == 'success' && format('{0}/frontend-base/frontend/coverage/lcov.info', runner.temp) || '' }}
          BASE_OUTCOME: ${{ steps.frontend-base.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'

          const report = 'coverage/lcov.info'
          if (!existsSync(report)) throw new Error('Frontend coverage report is missing')
          function lineTotals(path) {
            const lines = readFileSync(path, 'utf8').match(/^LF:\d+|^LH:\d+/gm) ?? []
            const found = lines.filter(line => line.startsWith('LF:')).reduce((sum, line) => sum + Number(line.slice(3)), 0)
            const hit = lines.filter(line => line.startsWith('LH:')).reduce((sum, line) => sum + Number(line.slice(3)), 0)
            if (!found) throw new Error(`Coverage report ${path} contains no lines`)
            return { hit, found }
          }
          const { hit, found } = lineTotals(report)
          const percentage = (100 * hit / found).toFixed(1)
          let comparison = ''
          if (process.env.BASE_REPORT) {
            if (!existsSync(process.env.BASE_REPORT)) throw new Error('Frontend base coverage report is missing')
            const { hit: baseHit, found: baseFound } = lineTotals(process.env.BASE_REPORT)
            const delta = 100 * hit / found - 100 * baseHit / baseFound
            comparison = ` · base: ${(100 * baseHit / baseFound).toFixed(1)}% · change: ${delta >= 0 ? '+' : ''}${delta.toFixed(1)} percentage points`
          } else if (process.env.BASE_OUTCOME === 'failure') {
            comparison = ' · base comparison unavailable (base tests did not pass)'
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Frontend line coverage\n\nPR: ${percentage}% (${hit}/${found} lines)${comparison}\n`)
          JS
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/index.html
          if-no-files-found: error

  # The one image (Documentation/adr/0013) builds and, on empty data and Backup folders,
  # serves the screens with their caching and answers /api. The release runs this first,
  # so a broken image is never published.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mortgage-management-app:ci .
      - name: The app starts, serves its screens, answers /api, runs non-root and backs up
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/backups"
          # A Linux host must give the image's fixed uid:gid (1000:1000) ownership of the
          # mounted folders (see README's Updating section); this mirrors that step.
          sudo chown -R 1000:1000 "$RUNNER_TEMP/data" "$RUNNER_TEMP/backups"
          docker run -d --name app -p 127.0.0.1:8080:8000 -e CHECK_FOR_UPDATES=false \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/backups:/backups" mortgage-management-app:ci
          trap 'docker logs app' EXIT
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8080/api/backups >/dev/null && break; sleep 1; done
          # The cache header of `path`, failing unless it answers 200.
          cache() { curl -sf -D - -o /dev/null "http://127.0.0.1:8080$1" | tr -d '\r' | sed -n 's/^cache-control: //Ip'; }
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(cache /)" = "no-cache"
          asset=$(curl -sf http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          test -n "$asset"
          test "$(cache "$asset")" = "public, max-age=31536000, immutable"
          curl -sf http://127.0.0.1:8080/api/backups
          # Non-root, and a Backup can be written to the mounted folder (acceptance criteria, #281).
          test "$(docker exec app id -u)" != "0"
          # Fresh data has no Backup yet, so the app already started one on its own; wait
          # for it to finish, or the requested Backup below gets 409 Conflict.
          backup_idle() {
            for _ in $(seq 60); do
              backup_status=$(curl -sf http://127.0.0.1:8080/api/backups) && echo "$backup_status" | grep -q '"running":false' && return 0
              sleep 1
            done
            return 1
          }
          backup_idle
          curl -sf -X POST http://127.0.0.1:8080/api/backups >/dev/null
          backup_idle
          echo "$backup_status" | grep -q '"last_error":null'
          ls "$RUNNER_TEMP/backups"/mortgage-backup-*.zip

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # docs/install.html offers it for download from GitHub Pages.
      - name: The Setup.bat on GitHub Pages is the one in windows/
        run: cmp windows/Setup.bat docs/Setup.bat

  # The Windows setup without Docker, end to end on a real Windows PC: what a Lender's
  # double-click does, for the commit being tested.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: The scripts' own decisions (Pester)
        shell: powershell
        run: |
          # The PowerShell Gallery's download sometimes fails on the runner: tried again.
          foreach ($try in 1..3) {
            try { Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop; break }
            catch { if ($try -eq 3) { throw }; Write-Host "Getting Pester failed, trying again: $($_.Exception.Message)"; Start-Sleep 20 }
          }
          Import-Module Pester -MinimumVersion 5.5
          $result = Invoke-Pester windows/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
      # The runner has Docker, so the setup is told to run without it, as on a PC with none.
      - name: Set up without Docker
        shell: powershell
        run: >
          windows/setup.ps1 -NonInteractive -Mode local
          -Ref "${{ github.event.pull_request.head.sha || github.sha }}"
          -InstallDir "$env:RUNNER_TEMP\mm"
      - name: The app starts, answers, and takes a Backup
        shell: powershell
        run: |
          $installed = "$env:RUNNER_TEMP\mm"
          $app = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', "$installed\app\windows\run.ps1", '-NoBrowser'
          try {
            $until = (Get-Date).AddMinutes(5)
            while ($true) {
              try { Invoke-RestMethod http://127.0.0.1:8080/api/customers | Out-Null; break }
              catch { if ((Get-Date) -gt $until) { throw 'The app did not answer through the UI.' }; Start-Sleep 3 }
            }
            $manifest = Invoke-RestMethod http://127.0.0.1:8080/manifest.webmanifest
            if ($manifest.name -ne 'Mortgage Management') { throw 'The app screens are not served.' }
            # The day's first request starts a Backup: a plain zip, with no zip program.
            $until = (Get-Date).AddMinutes(2)
            while (-not (Get-ChildItem "$installed\backups" -Filter '*.zip')) {
              if ((Get-Date) -gt $until) { throw "No Backup: $(Invoke-RestMethod http://127.0.0.1:8080/api/backups | ConvertTo-Json)" }
              Start-Sleep 2
            }
            Get-ChildItem "$installed\backups"
          } finally {
            Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      # Setup again installs the same commit beside the first, in a folder of its own, and
      # switches app (a junction) to it once it answers, keeping the first to go back to.
      - name: An update switches to the new version once it starts
        shell: powershell
        run: |
          $installed = "$env:RUNNER_TEMP\mm"
          windows/setup.ps1 -NonInteractive -Mode local -Ref "${{ github.event.pull_request.head.sha || github.sha }}" -InstallDir $installed
          $app = Get-Item "$installed\app"
          $target = @($app.Target)[0]
          $versions = @(Get-ChildItem "$installed\versions" -Directory | ForEach-Object { $_.Name })
          "app -> $target; versions: $versions"
          if (-not ($app.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'app is not a junction to a version.' }
          if ($target -notlike '*-2') { throw 'app does not point at the new version.' }
          if ($versions.Count -ne 2) { throw "Expected the new version and the one before it: $versions" }
          # The update left the new version running, in a window of its own.
          Invoke-RestMethod http://127.0.0.1:8080/api/customers | Out-Null
      - name: Uninstall keeps the latest Backup and removes the rest
        shell: powershell
        run: |
          $installed = "$env:RUNNER_TEMP\mm"
          $kept = "$env:RUNNER_TEMP\kept"
          # Its own process, as Uninstall.bat runs it, so its exit code is always set.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$installed\app\windows\uninstall.ps1" -NonInteractive -KeepBackupIn $kept
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path $installed) { throw "$installed is still there: $(Get-ChildItem -Recurse $installed | Select-Object -First 20)" }
          if (-not (Get-ChildItem $kept -Filter 'mortgage-backup-*.zip')) { throw 'The latest Backup was not kept.' }
          Get-ChildItem $kept
