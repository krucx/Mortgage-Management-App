name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs these before publishing images.
  workflow_call:
  workflow_dispatch:

# Jobs that need more ask for it themselves. Under release.yml's call, a job without its own
# block would otherwise get everything the caller grants this workflow.
permissions:
  contents: read

jobs:
  # Tree reuse (.github/scripts/tree-reuse.mjs). The push to main after a merge looks up
  # whether the merged tree already passed Tests on the pull request; if so every job below
  # is skipped and this job reports "Reused result from run <link>". It relies on main
  # requiring a branch to be up to date before merging, so the PR tested the same tree.
  # Any other event, or a tree with no passing record, runs everything in full. A failed
  # lookup, or a failed reuse job, also runs in full (the jobs below check !cancelled()).
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
      run-url: ${{ steps.lookup.outputs.run-url }}
    steps:
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: lookup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/tree-reuse.mjs lookup --workflow Tests --sha "$GITHUB_SHA"

  release-candidate:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-release-candidate.mjs

  tree-reuse:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-tree-reuse.mjs

  version-bump:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-check-version-unchanged.mjs
      - run: node --test .github/scripts/test-check-changelog.mjs
      - run: node --test .github/scripts/test-auto-merge-allowlist.mjs
      - name: Only the release candidate may change VERSION
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: node .github/scripts/check-version-unchanged.mjs
      - name: Changelog fragments for non-release PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: node .github/scripts/check-changelog.mjs

  release:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-release.mjs

  finding-reconciler:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-reconciler.mjs

  critical-finding-sync:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-critical-findings.mjs

  secret-scanning-alert-sync:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-secret-scanning-alerts.mjs

  integration-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-integration-summary.mjs

  coverage-summary:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/test-coverage-summary.mjs

  backend:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Current versions agree with VERSION
        run: node ../.github/scripts/check-version.mjs
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Run backend tests and collect line coverage
        run: COVERAGE_CORE=sysmon uv run pytest -n auto --cov=mortgage_backend --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-report=term
      - name: Add backend coverage to the job summary
        run: |
          node ../.github/scripts/coverage-summary.mjs \
            --format cobertura --label Backend \
            --report coverage.xml --minimum-rate 0.90 \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload backend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: error

  frontend:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: node --test ../.github/scripts/test-check-screen-coverage.mjs
      - name: Every screen in the router is covered by a QA scenario
        working-directory: .
        run: node .github/scripts/check-screen-coverage.mjs
      - name: Run frontend tests and collect line coverage
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=html --coverage.reporter=text
      - name: Add frontend coverage to the job summary
        run: |
          node ../.github/scripts/coverage-summary.mjs \
            --format lcov --label Frontend \
            --report coverage/lcov.info --minimum-rate 0.80 \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/index.html
          if-no-files-found: error

  # The one image (Documentation/adr/0013) builds and, on empty data and Backup folders,
  # serves the screens with their caching and answers /api. The release runs this first,
  # so a broken image is never published.
  image:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Layers go to the GitHub Actions cache under the scope the Container scan builds
      # from too, so the same tree is not built from scratch twice.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build the image
        run: >
          docker buildx build --load -t mortgage-management-app:ci
          --cache-from type=gha,scope=app-image --cache-to type=gha,mode=max,scope=app-image .
      - name: The app starts, serves its screens, answers /api, runs non-root and backs up
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/backups"
          # A Linux host must give the image's fixed uid:gid (1000:1000) ownership of the
          # mounted folders (see README's Updating section); this mirrors that step.
          sudo chown -R 1000:1000 "$RUNNER_TEMP/data" "$RUNNER_TEMP/backups"
          docker run -d --name app -p 127.0.0.1:8080:8000 -e CHECK_FOR_UPDATES=false \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/backups:/backups" mortgage-management-app:ci
          trap 'docker logs app' EXIT
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8080/api/backups >/dev/null && break; sleep 1; done
          # The cache header of `path`, failing unless it answers 200.
          cache() { curl -sf -D - -o /dev/null "http://127.0.0.1:8080$1" | tr -d '\r' | sed -n 's/^cache-control: //Ip'; }
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(cache /)" = "no-cache"
          asset=$(curl -sf http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          test -n "$asset"
          test "$(cache "$asset")" = "public, max-age=31536000, immutable"
          curl -sf http://127.0.0.1:8080/api/backups
          # Non-root, and a Backup can be written to the mounted folder (acceptance criteria, #281).
          test "$(docker exec app id -u)" != "0"
          # Fresh data has no Backup yet, so the app already started one on its own; wait
          # for it to finish, or the requested Backup below gets 409 Conflict.
          backup_idle() {
            for _ in $(seq 60); do
              backup_status=$(curl -sf http://127.0.0.1:8080/api/backups) && echo "$backup_status" | grep -q '"running":false' && return 0
              sleep 1
            done
            return 1
          }
          backup_idle
          curl -sf -X POST http://127.0.0.1:8080/api/backups >/dev/null
          backup_idle
          echo "$backup_status" | grep -q '"last_error":null'
          ls "$RUNNER_TEMP/backups"/mortgage-backup-*.zip

  # The Lender's workflows end to end in a browser: the app built from source on scratch
  # volumes, fresh and seeded with the golden book, driven by Playwright in its own container.
  # Runs only for release preparation: on the release/X.Y.Z pull request and the candidate
  # preflight (workflow_dispatch), or when dispatched by hand. Feature pull requests skip it,
  # and a skipped required check counts as passing; their authors run it locally instead.
  qa:
    needs: reuse
    if: >-
      !cancelled() && needs.reuse.outputs.reused != 'true' &&
      (startsWith(github.head_ref, 'release/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Image layers in the GitHub Actions cache (QA_BUILD_CACHE=gha): buildx can write it,
      # and the runtime step hands the cache token to the shell step that builds.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: scripts/qa-stack.sh test
        env:
          QA_BUILD_CACHE: gha
      - name: Upload Playwright results and app logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-test-results
          path: qa/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  pages:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docs/install.html offers it for download from GitHub Pages.
      - name: The Setup.bat on GitHub Pages is the one in windows/
        run: cmp windows/Setup.bat docs/Setup.bat

  # The Windows setup without Docker, end to end on a real Windows PC: what a Lender's
  # double-click does, for the commit being tested.
  windows:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Pester
        id: pester-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.home }}\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-5.5
      - name: The scripts' own decisions (Pester)
        shell: powershell
        run: |
          if ('${{ steps.pester-cache.outputs.cache-hit }}' -ne 'true') {
            # The PowerShell Gallery's download sometimes fails on the runner: tried again.
            foreach ($try in 1..3) {
              try { Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop; break }
              catch { if ($try -eq 3) { throw }; Write-Host "Getting Pester failed, trying again: $($_.Exception.Message)"; Start-Sleep 20 }
            }
          }
          Import-Module Pester -MinimumVersion 5.5
          $result = Invoke-Pester windows/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
      # The runner has Docker, so the setup is told to run without it, as on a PC with none.
      - name: Set up without Docker
        shell: powershell
        run: >
          windows/setup.ps1 -NonInteractive -Mode local
          -Ref "${{ github.event.pull_request.head.sha || github.sha }}"
          -InstallDir "$env:RUNNER_TEMP\mm"
      - name: The app starts, answers, and takes a Backup
        shell: powershell
        run: |
          $installed = "$env:RUNNER_TEMP\mm"
          $app = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', "$installed\app\windows\run.ps1", '-NoBrowser'
          try {
            $until = (Get-Date).AddMinutes(5)
            while ($true) {
              try { Invoke-RestMethod http://127.0.0.1:8080/api/customers | Out-Null; break }
              catch { if ((Get-Date) -gt $until) { throw 'The app did not answer through the UI.' }; Start-Sleep 3 }
            }
            $manifest = Invoke-RestMethod http://127.0.0.1:8080/manifest.webmanifest
            if ($manifest.name -ne 'Mortgage Management') { throw 'The app screens are not served.' }
            # The day's first request starts a Backup: a plain zip, with no zip program.
            $until = (Get-Date).AddMinutes(2)
            while (-not (Get-ChildItem "$installed\backups" -Filter '*.zip')) {
              if ((Get-Date) -gt $until) { throw "No Backup: $(Invoke-RestMethod http://127.0.0.1:8080/api/backups | ConvertTo-Json)" }
              Start-Sleep 2
            }
            Get-ChildItem "$installed\backups"
          } finally {
            Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      # Setup again installs the same commit beside the first, in a folder of its own, and
      # switches app (a junction) to it once it answers, keeping the first to go back to.
      - name: An update switches to the new version once it starts
        shell: powershell
        run: |
          $installed = "$env:RUNNER_TEMP\mm"
          windows/setup.ps1 -NonInteractive -Mode local -Ref "${{ github.event.pull_request.head.sha || github.sha }}" -InstallDir $installed
          $app = Get-Item "$installed\app"
          $target = @($app.Target)[0]
          $versions = @(Get-ChildItem "$installed\versions" -Directory | ForEach-Object { $_.Name })
          "app -> $target; versions: $versions"
          if (-not ($app.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'app is not a junction to a version.' }
          if ($target -notlike '*-2') { throw 'app does not point at the new version.' }
          if ($versions.Count -ne 2) { throw "Expected the new version and the one before it: $versions" }
          # The update left the new version running, in a window of its own.
          Invoke-RestMethod http://127.0.0.1:8080/api/customers | Out-Null
      - name: Uninstall keeps the latest Backup and removes the rest
        shell: powershell
        run: |
          $installed = "$env:RUNNER_TEMP\mm"
          $kept = "$env:RUNNER_TEMP\kept"
          # Its own process, as Uninstall.bat runs it, so its exit code is always set.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$installed\app\windows\uninstall.ps1" -NonInteractive -KeepBackupIn $kept
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path $installed) { throw "$installed is still there: $(Get-ChildItem -Recurse $installed | Select-Object -First 20)" }
          if (-not (Get-ChildItem $kept -Filter 'mortgage-backup-*.zip')) { throw 'The latest Backup was not kept.' }
          Get-ChildItem $kept

  # Records the tree this run validated (see reuse above) as the commit status
  # validated-tree/Tests on the commit it ran for: the PR head, or the main commit. A
  # failed run records failure, so a later pass on another run is needed to reuse it.
  # Not for pull requests from forks, whose token cannot write statuses.
  # needs lists every job in this workflow: add a new job here too.
  record:
    needs: [reuse, release-candidate, tree-reuse, version-bump, release, finding-reconciler, critical-finding-sync, secret-scanning-alert-sync, coverage-summary, backend, frontend, image, qa, pages, windows]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Record the validated tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          RUN_URL: ${{ needs.reuse.outputs.run-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: node .github/scripts/tree-reuse.mjs record --workflow Tests --sha "$SHA" --state "$STATE" --run-url "$RUN_URL"
