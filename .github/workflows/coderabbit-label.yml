name: CodeRabbit label

# Puts the coderabbit-review label on every integration/** -> main pull request, which is how it
# opts in to CodeRabbit (.coderabbit.yaml reviews.auto_review.labels; CONTRIBUTING.md "Selective
# CodeRabbit review"; ADR 0022). It is added when the pull request opens, reopens, leaves draft or has its base
# changed to main, and never removed, so an owner who takes it off is not overruled by a title edit.
#
# pull_request_target runs from the base branch with a write token, so this workflow checks out
# nothing and runs no pull-request code: it reads three event fields and calls the labels API.
# Fork pull requests are skipped; only a branch in this repository can be an integration branch.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, edited]

permissions: {}

jobs:
  label:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      startsWith(github.event.pull_request.head.ref, 'integration/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Add the coderabbit-review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'coderabbit-review') }}
          ACTION: ${{ github.event.action }}
        run: |
          # Skip when the label is already there.
          if [ "$HAS_LABEL" = "true" ]; then echo "Already labelled."; exit 0; fi
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f 'labels[]=coderabbit-review' --silent
          echo "Added coderabbit-review to #$PR_NUMBER ($ACTION)."
