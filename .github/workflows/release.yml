name: Release

# Pushing a version tag (e.g. 1.2.0) publishes both images to Docker Hub, tagged with
# that version and, when it is the highest version tagged so far, as the latest:
#   krucx11/mortgage-management-app:backend-1.2.0, :backend-latest
#   krucx11/mortgage-management-app:ui-1.2.0, :ui-latest
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

env:
  IMAGE: krucx11/mortgage-management-app

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      # The tag must be the version the app reports, so an image never claims the wrong one.
      - name: The tag matches the backend's and the frontend's version
        run: |
          backend=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)
          frontend=$(node -p "require('./frontend/package.json').version")
          echo "tag $GITHUB_REF_NAME, backend $backend, frontend $frontend"
          test "$GITHUB_REF_NAME" = "$backend" && test "$GITHUB_REF_NAME" = "$frontend"
      # A fix for an older version (e.g. 1.1.3 after 1.2.0) must not move the latest back.
      - name: Is this the highest version tagged?
        id: latest
        run: |
          highest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          echo "highest $highest"
          echo "latest=$([ "$GITHUB_REF_NAME" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tests, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: ui
            context: frontend
    steps:
      - uses: actions/checkout@v5
      # Built for Intel and Apple-silicon laptops alike.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.name }}-${{ github.ref_name }}
            ${{ needs.version.outputs.latest == 'true' && format('{0}:{1}-latest', env.IMAGE, matrix.name) || '' }}
          labels: |
            org.opencontainers.image.title=Mortgage Management (${{ matrix.name }})
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
