name: Release

# Pushing a version tag (e.g. 1.2.0) publishes the app's one image (Documentation/adr/0013)
# to Docker Hub, tagged with that version and, when it is the highest version tagged so
# far, as the latest:
#   krucx11/mortgage-management-app:1.2.0, :latest
# The backend-* and ui-* tags of the releases before one image stay on Docker Hub, never
# touched here, so a version folder from before still pulls its own images on rollback
# (Documentation/adr/0009).
# Then a GitHub Release, its notes the version's CHANGELOG section (the in-app update
# banner shows them), with the ready-built download Windows Setup installs from:
#   mortgage-management-1.2.0.zip, the code with its screens built (frontend/dist)
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

env:
  IMAGE: krucx11/mortgage-management-app

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      # The tag must be the version the app reports, so an image never claims the wrong one.
      - name: The tag matches the backend's and the frontend's version
        run: |
          backend=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)
          frontend=$(node -p "require('./frontend/package.json').version")
          echo "tag $GITHUB_REF_NAME, backend $backend, frontend $frontend"
          test "$GITHUB_REF_NAME" = "$backend" && test "$GITHUB_REF_NAME" = "$frontend"
      # A fix for an older version (e.g. 1.1.3 after 1.2.0) must not move the latest back.
      - name: Is this the highest version tagged?
        id: latest
        run: |
          highest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          echo "highest $highest"
          echo "latest=$([ "$GITHUB_REF_NAME" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tests, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Built for Intel and Apple-silicon laptops alike; the screens are built once, on
      # the runner's own platform (see Dockerfile).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ needs.version.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=Mortgage Management
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # After the image, so the update banner never offers a release Docker can't pull yet.
  github-release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the screens
        working-directory: frontend
        run: npm ci && npm run build
      # The code as tagged (git archive), with the built screens, under one folder.
      - name: The ready-built download
        run: |
          mkdir staging
          git archive --format=tar --prefix="mortgage-management-$TAG/" HEAD | tar -x -C staging
          cp -r frontend/dist "staging/mortgage-management-$TAG/frontend/dist"
          (cd staging && zip -qr "../mortgage-management-$TAG.zip" "mortgage-management-$TAG")
          unzip -l "mortgage-management-$TAG.zip" | grep -q "mortgage-management-$TAG/frontend/dist/index.html"
      # From the version's heading to the next one.
      - name: Its notes, from the CHANGELOG
        run: |
          awk -v tag="$TAG" '
            /^## \[/ { if (found) exit; if (index($0, "## [" tag "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "mortgage-management-$TAG.zip" --clobber &&
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --verify-tag;
          else
            gh release create "$TAG" "mortgage-management-$TAG.zip"
            --title "$TAG" --notes-file notes.md --verify-tag
            --latest=${{ needs.version.outputs.latest }};
          fi
