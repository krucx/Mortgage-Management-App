name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Requested major.minor.patch release version
        required: true
        type: string

# RELEASE_REQUIRE_APPROVAL (repository variable) is the rollout fallback switch: unset (the
# default) the release PR merges itself when the machine conditions hold
# (.github/scripts/lib/release-conditions.mjs); set to true it is left for the owner to approve and
# merge, as before. Removed once one release has auto-merged cleanly (#573).
#
# Why the preflight reports every required check: a pull request this workflow opens with
# GITHUB_TOKEN starts no workflow by itself. GitHub creates its pull_request runs (Tests, CodeQL,
# Container scan, Auto-merge) as "action_required", waiting for a maintainer's approval: confirmed on
# release PRs #563, #559 and #557, whose runs only ran as attempt 2 after the owner approved them. So
# the preflight dispatches Tests and CodeQL on the candidate commit itself, and their check runs
# (backend, frontend, image, qa, windows, version-bump, Analyze (...)) are the release PR's required
# checks. A merge made with GITHUB_TOKEN likewise starts no pull_request workflow, so this workflow
# dispatches the publish flow itself after the merge.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
  # The release-blocked issue a failure opens or updates (.github/scripts/release-blocked.mjs).
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Find the latest published version
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          latest=$(node .github/scripts/release.mjs latest-published --repo "$GH_REPOSITORY")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Run this workflow from main.' >&2
          exit 1

      - name: Check out main and prepare the requested version
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/$REQUESTED_VERSION"
          if ! [[ "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid version: $REQUESTED_VERSION (expected major.minor.patch)" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "branch_pushed=false" >> "$GITHUB_OUTPUT"
          git fetch origin main
          current_main=$(git show origin/main:VERSION)
          node .github/scripts/release-candidate.mjs \
            --version "$REQUESTED_VERSION" \
            --latest-published "${{ steps.release_state.outputs.latest }}" \
            --current-version "$current_main" \
            --check-only
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch --detach "origin/$branch"
            test "$(cat VERSION)" = "$REQUESTED_VERSION"
            grep -Fq "## [$REQUESTED_VERSION] - " CHANGELOG.md
            node .github/scripts/check-version.mjs
            echo "branch_pushed=true" >> "$GITHUB_OUTPUT"
            {
              echo "- Reused existing candidate branch: $branch at $(git rev-parse HEAD)."
              echo '- Version and derived references validated.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git switch --create "$branch" origin/main
            echo "- Starting point: main at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
            node .github/scripts/release-candidate.mjs \
              --version "$REQUESTED_VERSION" \
              --latest-published "${{ steps.release_state.outputs.latest }}" \
              --current-version "$current_main" \
              --date "$(date -u +%F)"
            node .github/scripts/sync-version.mjs
            (cd backend && uv lock)
            node .github/scripts/check-version.mjs
            echo '- Candidate VERSION, changelog and derived references prepared and validated.' >> "$GITHUB_STEP_SUMMARY"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "Prepare release $REQUESTED_VERSION"
            git push origin "HEAD:refs/heads/$branch"
            echo "branch_pushed=true" >> "$GITHUB_OUTPUT"
            echo "- Pushed candidate branch: $branch at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the full preflight on the candidate branch
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          LATEST_PUBLISHED: ${{ steps.release_state.outputs.latest }}
        run: |
          set -euo pipefail
          current_main=$(git show origin/main:VERSION)
          node .github/scripts/release-candidate.mjs \
            --version "$REQUESTED_VERSION" \
            --latest-published "$LATEST_PUBLISHED" \
            --current-version "$current_main" \
            --check-only
          # CodeQL in parallel with Tests: both report required checks on the candidate commit.
          node .github/scripts/release.mjs dispatch-and-wait \
            --repo "$GITHUB_REPOSITORY" --workflow codeql.yml --ref "$BRANCH" \
            --match-sha "$CANDIDATE_SHA" --timeout-minutes 60 > /tmp/codeql-preflight.json &
          codeql_pid=$!
          set +e
          result=$(node .github/scripts/release.mjs dispatch-and-wait \
            --repo "$GITHUB_REPOSITORY" --workflow test.yml --ref "$BRANCH" \
            --match-sha "$CANDIDATE_SHA" --timeout-minutes 60)
          status=$?
          wait "$codeql_pid"
          codeql_status=$?
          set -e
          url=$(jq -r '.url // empty' <<< "$result")
          conclusion=$(jq -r '.conclusion // empty' <<< "$result")
          codeql_url=$(jq -r '.url // empty' /tmp/codeql-preflight.json)
          codeql_conclusion=$(jq -r '.conclusion // empty' /tmp/codeql-preflight.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Preflight run: ${url:-not found} (${conclusion:-failed})" >> "$GITHUB_STEP_SUMMARY"
          echo "CodeQL preflight run: ${codeql_url:-not found} (${codeql_conclusion:-failed})" >> "$GITHUB_STEP_SUMMARY"
          [[ $status -eq 0 && $codeql_status -eq 0 ]]

      - name: Open the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          PREFLIGHT_URL: ${{ steps.preflight.outputs.url }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_REPOSITORY: ${{ github.repository }}
          LATEST_PUBLISHED: ${{ steps.release_state.outputs.latest }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_main=$(git show origin/main:VERSION)
          node .github/scripts/release-candidate.mjs \
            --version "$REQUESTED_VERSION" \
            --latest-published "$LATEST_PUBLISHED" \
            --current-version "$current_main" \
            --check-only
          if gh pr view "$BRANCH" --json url --jq .url >/tmp/release-pr-url 2>/dev/null; then
            url=$(cat /tmp/release-pr-url)
            echo "Reused existing pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            cat > /tmp/release-pr-body.md <<EOF
          ## Release candidate $REQUESTED_VERSION

          Prepared from main at SHA: $CANDIDATE_SHA.

          - Candidate preflight: [all required checks passed]($PREFLIGHT_URL)
          - Release checklist: [Documentation/RELEASE_CHECKLIST.md](Documentation/RELEASE_CHECKLIST.md)
          - Human-authored fragments under changelog/unreleased/ were collated into the dated CHANGELOG section.
          - Merge: this workflow merges the pull request itself when it is only a version upgrade of the preflight-validated commit with every required check green (.github/scripts/lib/release-conditions.mjs), then starts the publish flow. If the repository variable RELEASE_REQUIRE_APPROVAL is true, or a condition fails, it is left for the owner.
          EOF
            gh pr create --base main --head "$BRANCH" --title "Prepare release $REQUESTED_VERSION" \
              --body-file /tmp/release-pr-body.md
          fi
          echo "number=$(gh pr view "$BRANCH" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          echo "Candidate: $BRANCH ($CANDIDATE_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight: $PREFLIGHT_URL" >> "$GITHUB_STEP_SUMMARY"

      # The allowlist's release case (.github/scripts/lib/auto-merge-allowlist.mjs) decides; nothing
      # merges unless every machine condition holds for exactly the commit pushed and preflighted above.
      - name: Merge the release pull request when it is only a version upgrade
        id: merge
        if: vars.RELEASE_REQUIRE_APPROVAL != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/auto-merge.mjs release \
            --pr-number "$PR_NUMBER" --expected-head "$CANDIDATE_SHA" > /tmp/release-merge.json
          merge_commit=$(jq -r .mergeCommit /tmp/release-merge.json)
          echo "merge_commit=$merge_commit" >> "$GITHUB_OUTPUT"
          echo "- Release PR #$PR_NUMBER merged itself at $merge_commit (machine conditions held)." >> "$GITHUB_STEP_SUMMARY"

      - name: Start the publish flow for the merged release pull request
        id: dispatch
        if: vars.RELEASE_REQUIRE_APPROVAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh workflow run publish-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "pull_request=$PR_NUMBER"
          echo "- Started Publish merged release candidate for #$PR_NUMBER: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish-release.yml" >> "$GITHUB_STEP_SUMMARY"

      - name: Leave the release pull request for the owner (approval switch on)
        if: vars.RELEASE_REQUIRE_APPROVAL == 'true'
        run: echo '- RELEASE_REQUIRE_APPROVAL is true; the release PR waits for the owner to approve and merge.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report incomplete preparation on failure
        if: failure()
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
          BRANCH_PUSHED: ${{ steps.candidate.outputs.branch_pushed }}
          PREFLIGHT_URL: ${{ steps.preflight.outputs.url }}
        run: |
          {
            echo '## Release candidate preparation stopped'
            if [[ "${BRANCH_PUSHED:-false}" == true ]]; then
              echo "- Candidate branch: ${BRANCH:-unknown} exists on origin."
            else
              echo "- Candidate branch: ${BRANCH:-not created} was not pushed to origin."
            fi
            echo "- Preflight run: ${PREFLIGHT_URL:-not started or not completed}"
            echo '- No release pull request was opened unless the previous step completed.'
            echo '- An opened release pull request was not merged unless the merge step completed; a refused condition is in that step log. Nothing was published.'
            echo '- Review the failed step, add any missing human-authored release information, then rerun with the same version.'
          } >> "$GITHUB_STEP_SUMMARY"

      # One issue per version, opened or updated; nothing is retried or rolled back.
      - name: Open or update the release-blocked issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          STAGE: >-
            ${{ steps.preflight.outcome == 'failure' && 'preflight' ||
            (steps.pr.outcome == 'failure' || steps.merge.outcome == 'failure') && 'merge' ||
            steps.dispatch.outcome == 'failure' && 'publish' || 'preparation' }}
          DETAIL_URL: ${{ steps.preflight.outcome == 'failure' && steps.preflight.outputs.url || '' }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/release-blocked.mjs report --version "$VERSION" --stage "$STAGE" \
            --run-url "$RUN_URL" --detail-url "$DETAIL_URL" --pull-request "$PR_NUMBER"
