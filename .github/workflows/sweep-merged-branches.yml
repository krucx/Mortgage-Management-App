# Weekly cleanup of head branches that GITHUB_TOKEN merges (auto-merge, release candidate) leave
# behind: the repository setting "Automatically delete head branches" ignores those merges. Deletes
# the head of every PR merged at least 7 days before the run, so nothing merged this week is touched.
# Rules and tests: .github/scripts/lib/branch-cleanup.mjs, test-branch-cleanup.mjs. The repository
# is public, so listing PRs needs no pull-requests permission.
name: Sweep merged branches

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the branches that would be deleted
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Delete the heads of pull requests merged a week or more ago
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/sweep-merged-branches.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
