name: Container scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'

permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the combined application image
        run: docker build -t mortgage-management-app:trivy .

      - name: Scan the combined image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mortgage-management-app:trivy
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload results to GitHub code scanning
        if: >-
          always() && steps.scan.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Keep the scan results with the workflow run
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 30
