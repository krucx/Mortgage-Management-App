name: Container scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'

permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build the combined application image
        run: docker build -t mortgage-management-app:trivy .

      - name: Scan the combined image
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mortgage-management-app:trivy
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Reconcile critical image findings
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/critical-findings.mjs --trivy-sarif trivy-results.sarif

      - name: Upload results to GitHub code scanning
        if: >-
          always() && steps.scan.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Keep the scan results with the workflow run
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 30
