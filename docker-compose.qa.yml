# QA overlay: adds the qa-runner service and flips the app into QA mode.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.qa.yml up
services:
  app:
    environment:
      QA_MODE: "true"
      CHECK_FOR_UPDATES: "false"
    volumes:
      - ./qa/scratch-data:/data
      - ./qa/scratch-backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/customers')"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  qa-runner:
    build:
      context: .
      dockerfile: qa/Dockerfile.runner
    image: mortgage-qa-runner:qa
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
    volumes:
      - ./qa/test-results:/qa/test-results
    restart: "no"
