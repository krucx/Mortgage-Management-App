# CodeRabbit's free Open Source plan applies only while this repository is public.
language: en-US
early_access: false
reviews:
  # Balanced feedback reduces low-signal review work while keeping findings enabled.
  profile: chill
  path_filters:
    - '!frontend/openapi.json'
    - '!frontend/src/api.gen.ts'
    - '!**/uv.lock'
    - '!**/package-lock.json'
    - '!skills-lock.json'
    - '!docs/shots/**'
  # Judgement rules live in CODING_STANDARDS.md; each path points reviewers at it.
  path_instructions:
    - path: 'backend/**'
      instructions: >-
        Review against CODING_STANDARDS.md, especially: the module that owns a concept
        decides its rules, and callers must not.
    - path: 'frontend/**'
      instructions: >-
        Review against CODING_STANDARDS.md, especially: user-visible copy uses Documentation/GLOSSARY.md
        terms and is written for the Lender.
    - path: '{Documentation,docs}/**'
      instructions: >-
        Review against CODING_STANDARDS.md: use GLOSSARY terms, and a new domain decision
        needs an ADR in Documentation/adr.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
chat:
  auto_reply: true
knowledge_base:
  code_guidelines:
    filePatterns:
      - CODING_STANDARDS.md
