# CodeRabbit's free Open Source plan applies only while this repository is public.
language: en-US
early_access: false
reviews:
  profile: assertive
  path_filters:
    - '!frontend/openapi.json'
    - '!frontend/src/api.gen.ts'
    - '!**/uv.lock'
    - '!**/package-lock.json'
    - '!skills-lock.json'
    - '!docs/shots/**'
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
chat:
  auto_reply: true
